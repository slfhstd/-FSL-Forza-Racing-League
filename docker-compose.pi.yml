version: '3.8'

services:
  backend:
    image: ghcr.io/YOUR_GITHUB_USERNAME/forza-racing/backend-latest:latest
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/races.db
      - PORT=5000
      - OAUTH_ISSUER_URL=${OAUTH_ISSUER_URL}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - OAUTH_REDIRECT_URI=${OAUTH_REDIRECT_URI}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    image: ghcr.io/YOUR_GITHUB_USERNAME/forza-racing/frontend-latest:latest
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_OAUTH_ISSUER_URL=${VITE_OAUTH_ISSUER_URL}
      - VITE_OAUTH_CLIENT_ID=${VITE_OAUTH_CLIENT_ID}
      - VITE_OAUTH_REDIRECT_URI=${VITE_OAUTH_REDIRECT_URI}
    restart: unless-stopped

volumes:
  data:
